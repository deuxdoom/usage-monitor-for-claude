<!-- The single-row view. It replaces the whole window rather than living
     inside it: the clock, the two agent cards and the view/close controls
     are all it has, which is what keeps the row short enough to
     read at a glance. The cards are built by the popup JS from the same usage
     entries the detail bars are rendered from. -->
<section id="barView">
    <div id="clockWidget">
        <div id="clockDate"></div>
        <div id="clockTime"></div>
    </div>
    <div id="barCards"></div>
    <div id="barControls">
        <button type="button" id="barCloseBtn" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.58859 2.71569L2.64645 2.64645C2.82001 2.47288 3.08944 2.4536 3.28431 2.58859L3.35355 2.64645L8 7.293L12.6464 2.64645C12.8417 2.45118 13.1583 2.45118 13.3536 2.64645C13.5488 2.84171 13.5488 3.15829 13.3536 3.35355L8.707 8L13.3536 12.6464C13.5271 12.82 13.5464 13.0894 13.4114 13.2843L13.3536 13.3536C13.18 13.5271 12.9106 13.5464 12.7157 13.4114L12.6464 13.3536L8 8.707L3.35355 13.3536C3.15829 13.5488 2.84171 13.5488 2.64645 13.3536C2.45118 13.1583 2.45118 12.8417 2.64645 12.6464L7.293 8L2.64645 3.35355C2.47288 3.17999 2.4536 2.91056 2.58859 2.71569L2.64645 2.64645L2.58859 2.71569Z"/></svg></button>

    </div>
</section>

<section id="accountSection">
    <h2 id="headingAccount"></h2>
    <dl>
        <div id="emailRow">
            <dt id="labelEmail"></dt>
            <dd id="emailValue" role="button" tabindex="0"></dd>
        </div>
        <div id="planRow">
            <dt id="labelPlan"></dt>
            <dd id="planValue"></dd>
        </div>
    </dl>
</section>

<section id="usageSection">
    <h2 id="headingUsage"></h2>
    <div id="usageBars"></div>
</section>

<section id="extraSection">
    <h2 id="headingExtraUsage"></h2>
    <div class="bar-header">
        <span id="extraSpent"></span>
        <span id="extraPct"></span>
    </div>
    <div class="bar-container" id="extraBarContainer">
        <div class="bar-fill" id="extraFill"></div>
    </div>
</section>

<section id="installSection">
    <div class="heading-row">
        <h2 id="headingClaudeCode"></h2>
        <span id="changelogLink"></span>
    </div>
    <dl id="installRows"></dl>
</section>

<footer id="statusSection">
    <span id="statusText"></span>
    <span id="appVersion"></span>
</footer>

<script src="popup.js"></script>
</body>
</html>
