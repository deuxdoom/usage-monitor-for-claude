<!--
    Dev preview for the popup UI.

    Start server from the project root (serves the repo so the preview can fetch
    the real locale/*.json files):
        python -m http.server 8080

    Then open: http://localhost:8080/ai_agents_usage_monitor/popup/dev.html
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Popup Dev Preview</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #dce3dc;
        font-family: system-ui, sans-serif;
    }

    .dev-controls {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;

        & button, & select {
            padding: 6px 14px;
            background: #fbfaf6;
            color: #202e2a;
            border: 1px solid #bfcac0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        & button:hover, & select:hover { background: #edf3ec; }

        & select { margin-bottom: 8px; }
    }

    iframe {
        border: none;
        width: 340px;
        background: #101316;
        visibility: hidden;
        transition: width 0.15s ease;
    }
</style>
</head>
<body>
<div class="dev-controls">
    <select id="langSelect" title="Language"></select>
    <select id="codexSelect" title="What the Codex read does (reloads the preview)">
        <option value="ok">Codex read: data (1.2s)</option>
        <option value="slow">Codex read: data (4s)</option>
        <option value="fail">Codex read: fails</option>
    </select>
    <button onclick="loadPreset('full')">Full data</button>
    <button onclick="loadPreset('minimal')">Minimal (next update)</button>
    <button onclick="loadPreset('error')">Error state</button>
    <button onclick="loadPreset('refreshing')">Refreshing (hours)</button>
    <button onclick="loadPreset('loading')">Initial load</button>
    <button onclick="randomize()">Randomize bars</button>
</div>

<iframe id="popup"></iframe>

<script>
const COLORS = {
    bg: '#101316', fg: '#cbd3d3', fg_dim: '#879397', fg_heading: '#f3f5f2', fg_link: '#88b7d1',
    bar_bg: '#30393b', bar_fg: '#72d2af', bar_fg_alt: '#dbb477', bar_fg_warn: '#ef8177',
    bar_divider: '#c9d9d04d', bar_marker: '#e2eee8cc',
};

// Widths the app applies per view, mirrored here so the preview's frame
// changes size the way the real window does. See UsagePopup.WIDTH/BAR_WIDTH.
const VIEW_WIDTHS = { detail: 340, bar: 360 };

// Available locales (filename code -> display name). Keep in sync with locale/*.json.
const LANGS = [['en', 'English'], ['ja', 'Japanese'], ['ko', 'Korean']];

// Presets carry *semantic* fields; display strings are built from the loaded
// locale so every text case can be inspected in any language.
const PRESETS = {
    full: {
        profile: { email: 'user@example.com', name: 'Max Clau', plan: 'Max (Team)' },
        usage: [
            { unit: 'hour', period: 5, pct: 42, warn: false,
              reset: { kind: 'in', duration: '2h 30m' }, dividers: [0.2, 0.4, 0.6, 0.8], marker_rel: 0.5 },
            { unit: 'week', period: 7, pct: 65, warn: true,
              reset: { kind: 'date', month: 1, day: 18, clock: '12:00' }, dividers: [0.143, 0.286, 0.429, 0.571, 0.714, 0.857], marker_rel: 0.55 },
            { unit: 'week', suffix: 'Sonnet', pct: 30, warn: false,
              reset: { kind: 'date', month: 1, day: 18, clock: '12:00' }, dividers: [0.143, 0.286, 0.429, 0.571, 0.714, 0.857], marker_rel: 0.55 },
            { unit: 'week', suffix: 'Opus', pct: 12, warn: false,
              reset: { kind: 'date', month: 1, day: 18, clock: '12:00' }, dividers: [0.143, 0.286, 0.429, 0.571, 0.714, 0.857], marker_rel: 0.55 },
        ],
        extra: { pct: 23, used: '$4.60', limit: '$20.00' },
        installations: [
            { name: 'CLI', version: '2.1.69' },
            { name: 'VS Code', version: '2.1.69' },
            { name: 'Cursor', version: '2.1.65' },
        ],
        status: () => ({ last_success_time: now() - 3, next_poll_time: now() + 20, refreshing: false, error: null }),
    },
    minimal: {
        profile: null,
        usage: [
            { unit: 'hour', period: 5, pct: 10, warn: false,
              reset: { kind: 'in', duration: '4h 50m' }, dividers: [0.2, 0.4, 0.6, 0.8], marker_rel: 0.03 },
        ],
        extra: null,
        installations: [],
        // ~90s ago + next poll soon -> "Updated 1m ago . Next update in 1m" (the overflow case from issue #53).
        status: () => ({ last_success_time: now() - 90, next_poll_time: now() + 90, refreshing: false, error: null }),
    },
    error: {
        profile: { email: 'user@example.com', name: '', plan: 'Max' },
        usage: [
            { unit: 'hour', period: 5, pct: 95, warn: true,
              reset: { kind: 'in', duration: '12m' }, dividers: [0.2, 0.4, 0.6, 0.8], marker_rel: 0.96 },
            { unit: 'week', period: 7, pct: 88, warn: true,
              reset: { kind: 'tomorrow', clock: '08:00' }, dividers: [0.143, 0.286, 0.429, 0.571, 0.714, 0.857], marker_rel: 0.80 },
        ],
        extra: null,
        installations: [{ name: 'CLI', version: '2.1.69' }],
        status: () => ({ last_success_time: now() - 300, next_poll_time: now() + 30, refreshing: false, error: 'Could not connect to Anthropic API.' }),
    },
    refreshing: {
        profile: { email: 'user@example.com', name: 'Max Clau', plan: 'Max (Team)' },
        usage: [
            { unit: 'hour', period: 5, pct: 42, warn: false,
              reset: { kind: 'in', duration: '2h 30m' }, dividers: [0.2, 0.4, 0.6, 0.8], marker_rel: 0.5 },
        ],
        extra: null,
        installations: [{ name: 'CLI', version: '2.1.69' }],
        // ~65 min ago -> exercises the "{h}h {m}m" duration variant in the footer.
        status: () => ({ last_success_time: now() - 3900, next_poll_time: null, refreshing: true, error: null }),
    },
    loading: {
        profile: null, usage: [], extra: null, installations: [],
        status: { staticKey: 'status_refreshing', is_error: false, refreshing: true },
    },
};

// The Codex view is fed by one bridge call, so the preview mirrors its whole
// payload: local per-model token windows plus the server account and quotas.
const CODEX = {
    profile: { email: 'user@example.com', name: '', plan: 'ChatGPT Plus' },
    usage: [
        { unit: 'hour', period: 5, seconds: 18000, pct: 97,
          reset: { kind: 'in', duration: '3h 55m' }, dividers: [0.2, 0.4, 0.6, 0.8], marker_rel: 0.21 },
        { unit: 'week', period: 7, seconds: 604800, pct: 15,
          reset: { kind: 'date', month: 1, day: 18, clock: '12:00' },
          dividers: [0.143, 0.286, 0.429, 0.571, 0.714, 0.857], marker_rel: 0.40 },
    ],
    windows: [
        { seconds: 18000, tokens: 9519664, models: [
            { model: 'gpt-6-astra', tokens: 6485168 }, { model: 'gpt-6', tokens: 3034496 }] },
        { seconds: 604800, tokens: 21403992, models: [
            { model: 'gpt-6-astra', tokens: 14903992 }, { model: 'gpt-6', tokens: 6500000 }] },
    ],
    installations: [
        { name: 'Codex CLI', version: '0.153.0' },
        { name: 'VS Code (Codex)', version: '26.5901.22334' },
    ],
};

const iframe = document.getElementById('popup');
const langSelect = document.getElementById('langSelect');
const codexSelect = document.getElementById('codexSelect');
const win = () => iframe.contentWindow;
const now = () => Date.now() / 1000;

const previewParams = new URLSearchParams(location.search);
let currentLang = LANGS.some(([code]) => code === previewParams.get('lang')) ? previewParams.get('lang') : 'en';
let currentLocale = null;
let currentPreset = 'full';
// Which view the preview opens in, so the stored-view path is exercised too.
let currentView = previewParams.get('view') === 'bar' ? 'bar' : 'detail';

// Map locale JSON keys onto the compact translation object popup.js expects.
function buildTranslations(loc) {
    return {
        title: loc.app_name, account: loc.account, email: loc.email, plan: loc.plan,
        show_more_limits: loc.show_more_limits, show_fewer_limits: loc.show_fewer_limits,
        usage: loc.usage, extra_usage: loc.extra_usage, claude_code: loc.claude_code, changelog: loc.changelog,
        project_on_github: loc.menu_project,
        pin_popup: loc.pin_popup, unpin_popup: loc.unpin_popup, close_popup: loc.close_popup, refresh: loc.refresh,
        view_bar: loc.view_bar, view_detail: loc.view_detail,
        bar_used: loc.bar_used, bar_left: loc.bar_left,
        bar_mode_used: loc.bar_mode_used, bar_mode_left: loc.bar_mode_left,
        bar_toggle_hint: loc.bar_toggle_hint, bar_fill_hint: loc.bar_fill_hint, drag_to_move: loc.drag_to_move,
        detail_tokens: loc.detail_tokens, detail_messages: loc.detail_messages,
        detail_estimated: loc.detail_estimated, detail_models: loc.detail_models,
        detail_loading: loc.detail_loading, detail_unavailable: loc.detail_unavailable,
        detail_no_usage: loc.detail_no_usage, detail_source: loc.detail_source,
        name: loc.name, reveal_email: loc.reveal_email, hide_email: loc.hide_email,
        status_updated_s: loc.status_updated_s, status_updated: loc.status_updated,
        status_next_update: loc.status_next_update, status_refreshing: loc.status_refreshing,
        duration_hm: loc.duration_hm, duration_m: loc.duration_m, duration_ms: loc.duration_ms, duration_s: loc.duration_s,
        // Mirrors _init_config(): every codex_* string is forwarded as-is.
        ...Object.fromEntries(Object.entries(loc).filter(([key]) => key.startsWith('codex_'))),
    };
}

// Mirrors _pace_text() in popup.py so the preview shows the same wording.
function localizePace(loc, pct, markerRel) {
    if (pct >= 100) return loc.pace_exhausted;
    if (markerRel === null || markerRel === undefined) return '';
    const elapsed = markerRel * 100;
    const state = pct > elapsed ? loc.pace_ahead : loc.pace_within;
    return loc.pace_elapsed.replace('{pct}', Math.round(elapsed)).replace('{state}', state);
}

function localizeLabel(loc, entry) {
    const template = entry.unit === 'hour' ? loc.session_label : loc.weekly_label;
    const unit = entry.unit === 'hour' ? loc.unit_hours : loc.unit_days;
    const suffix = entry.suffix || unit.replace('{n}', entry.period);
    return template.replace('{suffix}', suffix);
}

// The bar view picks its two rows by window length, so the preview has to
// carry the same durations the app derives from each field name.
function periodSeconds(entry) {
    if (entry.unit === 'hour') return (entry.period || 5) * 3600;
    return (entry.period || 7) * 86400;
}

// Map a preset usage entry to its API field key (so compact_hide preview works).
function fieldKey(entry) {
    if (entry.unit === 'hour') return 'five_hour';
    if (!entry.suffix) return 'seven_day';
    return 'seven_day_' + entry.suffix.toLowerCase();
}

function localizeReset(loc, reset) {
    if (!reset) return '';
    if (reset.kind === 'in') return loc.resets_in.replace('{duration}', reset.duration);
    if (reset.kind === 'tomorrow') return loc.resets_tomorrow.replace('{clock}', reset.clock);
    if (reset.kind === 'date') {
        const date = loc.date_month_day.replace('{m}', reset.month).replace('{d}', reset.day);
        return loc.resets_date.replace('{date}', date).replace('{clock}', reset.clock);
    }
    return '';
}

// Build the data snapshot popup.js consumes from a preset + the active locale.
function resolveData(name, loc) {
    const preset = PRESETS[name];

    const usage = (preset.usage || []).map((entry) => ({
        key: fieldKey(entry),
        label: localizeLabel(loc, entry),
        period_seconds: periodSeconds(entry),
        pct_text: entry.pct + '%',
        left_text: Math.max(0, 100 - entry.pct) + '%',
        fill_pct: entry.pct / 100,
        warn: entry.warn,
        pace_text: localizePace(loc, entry.pct, entry.marker_rel),
        reset_text: localizeReset(loc, entry.reset),
        dividers: entry.dividers,
        marker_rel: entry.marker_rel,
    }));

    const extra = preset.extra ? {
        has_limit: true,
        pct_text: preset.extra.pct + '%',
        fill_pct: preset.extra.pct / 100,
        spent_text: loc.extra_usage_spent.replace('{used}', preset.extra.used).replace('{limit}', preset.extra.limit),
    } : null;

    let status = typeof preset.status === 'function' ? preset.status() : preset.status;
    if (status && status.staticKey) {
        status = { text: loc[status.staticKey], is_error: status.is_error, refreshing: status.refreshing };
    }

    return { profile: preset.profile, usage, extra, installations: preset.installations || [], status };
}

// Build the Codex bridge payload the same way _PopupApi.codex_usage() does.
function resolveCodex(loc) {
    const usage = CODEX.usage.map((entry) => ({
        key: 'codex_' + entry.unit,
        label: localizeLabel(loc, entry),
        period_seconds: entry.seconds,
        pct_text: entry.pct + '%',
        left_text: Math.max(0, 100 - entry.pct) + '%',
        fill_pct: entry.pct / 100,
        warn: entry.pct >= 100 || entry.pct > entry.marker_rel * 100,
        pace_text: entry.pct > 0 ? localizePace(loc, entry.pct, entry.marker_rel) : '',
        detail_seconds: entry.seconds,
        reset_text: entry.pct > 0 ? localizeReset(loc, entry.reset) : '',
        dividers: entry.pct > 0 ? entry.dividers : [],
        marker_rel: entry.pct > 0 ? entry.marker_rel : null,
    }));

    // The app sends the chosen refresh interval with every read; the preview
    // pins it to the default so the page's own timer and countdown agree.
    const refreshSeconds = 60;

    // _PopupApi labels each local window before sending it, so the page never
    // matches window lengths itself.
    const windows = CODEX.windows.map((window) => ({
        ...window,
        period_text: window.seconds % 86400 === 0 ? loc.codex_seven_days : loc.codex_five_hours,
    }));

    return {
        windows, updated_at: now(), partial: false, available: true,
        installations: CODEX.installations, refresh_seconds: refreshSeconds,
        account: { profile: CODEX.profile, usage,
                   status: { last_success_time: now(), next_poll_time: now() + refreshSeconds, error: null } },
    };
}

// Try both layouts: server rooted at the repo (dev.html under
// /ai_agents_usage_monitor/popup/) and at the package (dev.html under /popup/).
async function loadLocale(code) {
    // Cache-buster so edits to the locale files show up without a hard reload.
    const bust = `?t=${Date.now()}`;
    for (const base of ['../../locale', '../locale']) {
        const response = await fetch(`${base}/${code}.json${bust}`, { cache: 'no-store' });
        if (response.ok) return response.json();
    }
    throw new Error(`Could not load locale "${code}". Start the server from the repo root: python -m http.server 8080`);
}

// Reload the iframe and resolve once popup.html has finished loading.
function reloadFrame() {
    return new Promise((resolve) => {
        iframe.addEventListener('load', resolve, { once: true });
        iframe.src = 'popup.html';
    });
}

// Apply a language: reload the frame and re-run init() so the new translations
// (which popup.js only reads in init()) take effect.
async function applyLanguage(code) {
    currentLang = code;
    currentLocale = await loadLocale(code);
    await reloadFrame();
    win().pywebview = { api: { close() {}, open_url() {}, open_project() {},
        // Fake latency so the refresh button's spinner is visible in the preview.
        refresh() { return new Promise((resolve) => setTimeout(() => resolve(true), 900)); },
        // Fake session-log detail so the click-to-expand behavior is previewable
        // without a real Claude Code install. 'five_hour' gets a full example
        // with models; 'seven_day' comes back empty to preview the no-usage state.
        session_detail(field) {
            return new Promise((resolve) => setTimeout(() => resolve(
                field === 'seven_day'
                    ? { unavailable: false, tokens: '0', messages: '0', estimated_total: null, models: [] }
                    : {
                        unavailable: false, tokens: '353,830', messages: '1,033', estimated_total: '853,171',
                        models: [
                            { model: 'claude-sonnet-4-6', tokens: '341,802', pct: '96.6' },
                            { model: 'claude-opus-4-8', tokens: '12,028', pct: '3.4' },
                        ],
                    },
            ), 600));
        },
        set_pinned(pinned) { return Promise.resolve(pinned); },
        // The app changes the window width here, before the page re-renders,
        // so the whole switch costs one resize. The frame does the same.
        set_view_mode(mode) {
            currentView = mode;
            iframe.style.width = VIEW_WIDTHS[mode] + 'px';
            return Promise.resolve(true);
        },
        begin_drag() { return Promise.resolve(true); },
        drag() { return Promise.resolve(true); },
        end_drag() { return Promise.resolve(); },
        report_height(h) {
            iframe.style.height = h + 'px';
            iframe.style.visibility = 'visible';
        },
        // A real first read starts the Codex app-server and takes about a second.
        // The delay is what makes the held outgoing view visible in the preview.
        codex_usage() {
            const mode = codexSelect.value;
            return new Promise((resolve, reject) => setTimeout(
                () => (mode === 'fail' ? reject(new Error('codex unavailable')) : resolve(resolveCodex(currentLocale))),
                mode === 'slow' ? 4000 : 1200,
            ));
        } } };
    // Demo set so toggling the pin button previews compact hiding of both
    // whole sections and an individual usage bar.
    const compactHide = ['account', 'extra_usage', 'claude_code', 'status', 'seven_day_opus'];
    iframe.style.width = VIEW_WIDTHS[currentView] + 'px';
    win().init({
        colors: COLORS, t: buildTranslations(currentLocale), app_version: '3.2.0',
        compact_hide: compactHide, view: currentView,
        lang_tag: currentLang, time_format: '24h',
        data: resolveData(currentPreset, currentLocale),
    });
}

function loadPreset(name) {
    currentPreset = name;
    location.hash = name;
    win().updateData(resolveData(name, currentLocale));
}

function randomize() {
    location.hash = 'randomize';
    currentPreset = 'full';
    const data = resolveData('full', currentLocale);
    for (const entry of data.usage) {
        const pct = Math.round(Math.random() * 100);
        entry.fill_pct = pct / 100;
        entry.pct_text = pct + '%';
        entry.left_text = Math.max(0, 100 - pct) + '%';
        entry.warn = entry.marker_rel !== null && pct / 100 > entry.marker_rel;
    }
    if (data.extra) {
        const pct = Math.round(Math.random() * 100);
        data.extra.fill_pct = pct / 100;
        data.extra.pct_text = pct + '%';
    }
    win().updateData(data);
}

for (const [code, name] of LANGS) {
    const option = document.createElement('option');
    option.value = code;
    option.textContent = `${name} (${code})`;
    langSelect.append(option);
}
langSelect.value = currentLang;
langSelect.addEventListener('change', () => applyLanguage(langSelect.value));
// popup.js keeps the first Codex response for the life of the page, so reload
// the frame - the tab switch is only pending once per load.
codexSelect.addEventListener('change', () => applyLanguage(currentLang));

(async () => {
    const hash = location.hash.slice(1);
    if (PRESETS[hash]) currentPreset = hash;
    await applyLanguage(currentLang);
    if (previewParams.get('provider') === 'codex' && currentView === 'detail') {
        win().selectProvider('codex');
    }
    if (hash === 'randomize') randomize();
})();
</script>
</body>
</html>
