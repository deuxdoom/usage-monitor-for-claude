<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
    The update window. One frameless page carries the whole update: what is
    new, the steps, the progress and the result. Python pushes every change
    through init(), setNotes() and setState(); the page only renders them and
    calls back through pywebview.api.start(), close() and open_notes().
    Release text arrives from GitHub, so it is only ever written with
    textContent - never parsed as HTML.
-->
<style>
@font-face {
    font-family: 'Pretendard JP';
    src: url('PretendardJPVariable.woff2') format('woff2');
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
}

:root {
    --bg: #101316;
    --surface: #1a1f22;
    --surface-raised: #212729;
    --stroke: rgb(203 211 211 / 13%);
    --fg: #cbd3d3;
    --dim: #879397;
    --heading: #f3f5f2;
    --accent: #72d2af;
    --accent-ink: #0d231b;
    --link: #88b7d1;
    --warn: #ef8177;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { height: 100%; overflow: hidden; }

body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 'Pretendard JP', 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
    user-select: none;
    opacity: 0;
    transition: opacity 0.18s ease-out;

    &.open { opacity: 1; }
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
/* Hangul and kana wrap between words, not inside them. */
.summary, .note-section li, #message, .notes-message { word-break: keep-all; overflow-wrap: anywhere; }
button:focus-visible { outline: 2px solid rgb(243 245 242 / 32%); outline-offset: 2px; }

/* The window has no frame, so this row is both its title and its handle. */
.titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 44px;
    padding: 0 10px 0 20px;
    flex: none;
}

.brand {
    display: flex;
    align-items: center;
    align-self: stretch;
    flex: 1;
    gap: 9px;
    cursor: default;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--dim);
}

.brand-mark {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    width: 18px;
    height: 18px;
    padding: 4px;
    border-radius: 5px;
    background: var(--accent);

    & i { display: block; width: 2.5px; border-radius: 2px; background: var(--accent-ink); }
    & i:nth-child(1) { height: 4px; }
    & i:nth-child(2) { height: 9px; }
    & i:nth-child(3) { height: 6px; }
}

.icon-button {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    color: var(--dim);

    & svg { width: 14px; height: 14px; }
    &:hover { color: var(--heading); background: rgb(203 211 211 / 9%); }
}

main {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    padding: 6px 24px 0;
}

h1 {
    font-size: 21px;
    line-height: 1.3;
    font-weight: 750;
    letter-spacing: -0.02em;
    color: var(--heading);
}

.versions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;

    & svg { width: 14px; height: 14px; color: var(--dim); }
}

.version {
    padding: 3px 9px;
    border: 1px solid var(--stroke);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    color: var(--dim);

    &.latest {
        border-color: color-mix(in srgb, var(--accent) 45%, transparent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--accent);
    }
}

.summary {
    margin-top: 12px;
    color: var(--fg);
}

/* Release notes take whatever height is left and scroll inside themselves,
   so a long release never changes the window's size. */
.notes {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    margin-top: 14px;
    border: 1px solid var(--stroke);
    border-radius: 12px;
    background: var(--surface);
}

.notes-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px 8px;
    flex: none;

    & h2 { font-size: 12px; font-weight: 700; color: var(--heading); }
}

.link-button {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--link);

    & svg { width: 11px; height: 11px; }
    &:hover { text-decoration: underline; }
}

.notes-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 14px 12px;
    scrollbar-width: thin;
    scrollbar-color: rgb(203 211 211 / 22%) transparent;
}

.notes-message { color: var(--dim); font-size: 12px; }

.note-section + .note-section { margin-top: 10px; }

.note-section h3 {
    margin-bottom: 5px;
    font-size: 11px;
    font-weight: 700;
    color: var(--dim);
}

.note-section ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }

.note-section li {
    position: relative;
    padding-left: 12px;
    font-size: 12.5px;
    line-height: 1.5;

    &::before {
        content: '';
        position: absolute;
        left: 1px;
        top: 0.62em;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent);
    }

    & strong { font-weight: 650; color: var(--heading); margin-right: 5px; }
}

.notes-more { margin-top: 8px; font-size: 11.5px; color: var(--dim); }

/* Five steps in a row. Each node is pending, active, done or error; the line
   in front of a node lights up once the node before it is done. */
.steps {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    margin-top: 16px;
    list-style: none;
    flex: none;
}

.step {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--dim);

    & + .step::before {
        content: '';
        position: absolute;
        top: 10px;
        right: calc(50% + 15px);
        width: calc(100% - 30px);
        height: 2px;
        border-radius: 2px;
        background: var(--stroke);
        transition: background-color 0.25s ease;
    }
}

.dot {
    position: relative;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--stroke);
    border-radius: 50%;
    font-size: 10.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
}

.step[data-state="active"] {
    color: var(--heading);

    & .dot {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent);
        animation: pulse 1.6s ease-out infinite;
    }
}

.step[data-state="done"] {
    color: var(--fg);

    & .dot { border-color: var(--accent); background: var(--accent); color: transparent; }
    /* A check drawn from two borders, so it never depends on a glyph. */
    & .dot::after {
        content: '';
        position: absolute;
        width: 5px;
        height: 9px;
        margin-top: -2px;
        border-right: 2px solid var(--accent-ink);
        border-bottom: 2px solid var(--accent-ink);
        transform: rotate(45deg);
    }
}

.step[data-state="done"] + .step::before { background: var(--accent); }

.step[data-state="error"] {
    color: var(--warn);

    & .dot { border-color: var(--warn); background: var(--warn); color: var(--accent-ink); }
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); }
    100% { box-shadow: 0 0 0 7px transparent; }
}

.progress { margin-top: 16px; flex: none; }

.track {
    position: relative;
    height: 6px;
    overflow: hidden;
    border-radius: 999px;
    background: rgb(203 211 211 / 12%);
}

.fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.3s ease, background-color 0.25s ease;
}

body[data-phase="running"] .fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / 28%), transparent);
    animation: shimmer 1.4s linear infinite;
}

body[data-phase="failed"] .fill { background: var(--warn); }

@keyframes shimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
}

.status {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-top: 9px;
    min-height: 19px;

    & #message { min-width: 0; color: var(--fg); }
    & #percent { flex: none; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--dim); }
}

body[data-phase="failed"] #message { color: var(--warn); }

#detail {
    margin-top: 3px;
    min-height: 17px;
    font-size: 11.5px;
    color: var(--dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 14px 24px 20px;
    flex: none;
}

.button {
    min-width: 92px;
    height: 36px;
    padding: 0 16px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    transition: background-color 0.15s ease, opacity 0.15s ease;

    &.primary { background: var(--accent); color: var(--accent-ink); }
    &.primary:hover { background: #8fe0c2; }
    &.ghost { border: 1px solid var(--stroke); color: var(--fg); }
    &.ghost:hover { background: rgb(203 211 211 / 8%); }
    &:disabled { opacity: 0.45; cursor: default; }
    &.primary:disabled:hover { background: var(--accent); }
}

/* During the update nothing may be clicked: the buttons keep their space so
   the layout does not move, and the close control is gone. */
body[data-phase="running"] .actions { visibility: hidden; }

@media (prefers-reduced-motion: reduce) {
    body, .fill, .dot, .step::before { transition: none; }
    .step[data-state="active"] .dot, body[data-phase="running"] .fill::after { animation: none; }
}
</style>
</head>
<body data-phase="loading">
<!-- pywebview treats a press on any descendant of a drag region as a drag, so
     the region stops short of the close button instead of wrapping it. -->
<header class="titlebar">
    <div class="brand pywebview-drag-region"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>AI Agents Usage Monitor</span></div>
    <button type="button" class="icon-button" id="closeButton"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3.35 2.65a.5.5 0 0 0-.7.7L7.29 8l-4.64 4.65a.5.5 0 0 0 .7.7L8 8.71l4.65 4.64a.5.5 0 0 0 .7-.7L8.71 8l4.64-4.65a.5.5 0 0 0-.7-.7L8 7.29z"/></svg></button>
</header>

<main>
    <h1 id="heading"></h1>
    <div class="versions">
        <span class="version" id="currentVersion"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M9.15 3.15a.5.5 0 0 1 .7 0l4.5 4.5a.5.5 0 0 1 0 .7l-4.5 4.5a.5.5 0 0 1-.7-.7L12.79 8.5H2.5a.5.5 0 0 1 0-1h10.29L9.15 3.85a.5.5 0 0 1 0-.7"/></svg>
        <span class="version latest" id="latestVersion"></span>
    </div>
    <p class="summary" id="summary" hidden></p>

    <section class="notes">
        <div class="notes-head">
            <h2 id="notesTitle"></h2>
            <button type="button" class="link-button" id="fullNotes"><span id="fullNotesText"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M5.5 3a.5.5 0 0 0 0 1h5.79l-8.14 8.15a.5.5 0 0 0 .7.7L12 4.71v5.79a.5.5 0 0 0 1 0v-7a.5.5 0 0 0-.5-.5z"/></svg></button>
        </div>
        <div class="notes-body" id="notesBody"></div>
    </section>

    <ol class="steps" id="steps"></ol>

    <div class="progress">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="status"><span id="message"></span><span id="percent"></span></div>
        <div id="detail"></div>
    </div>
</main>

<footer class="actions">
    <button type="button" class="button ghost" id="laterButton"></button>
    <button type="button" class="button primary" id="updateButton" disabled></button>
    <button type="button" class="button primary" id="doneButton" hidden></button>
</footer>

<script>
const STEPS = ['download', 'verify', 'close', 'install', 'restart'];
const AUTO_CLOSE_SECONDS = 4;
let labels = {};
let phase = 'loading';
let notesShown = false;
let countdownId = null;

const $ = (id) => document.getElementById(id);

/** Called once by Python with the translated labels and both versions. */
function init(config) {
    labels = config.labels;
    document.documentElement.lang = config.lang;
    $('currentVersion').textContent = config.current;
    $('latestVersion').textContent = config.latest;
    $('notesTitle').textContent = labels.notes;
    $('fullNotesText').textContent = labels.full_notes;
    $('laterButton').textContent = labels.later;
    $('updateButton').textContent = labels.update_now;
    $('closeButton').setAttribute('aria-label', labels.close);
    $('closeButton').title = labels.close;

    $('steps').replaceChildren(...STEPS.map((step, index) => {
        const item = document.createElement('li');
        item.className = 'step';
        item.dataset.step = step;
        item.dataset.state = 'pending';
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.textContent = String(index + 1);
        const label = document.createElement('span');
        label.textContent = labels.steps[step];
        item.append(dot, label);
        return item;
    }));

    showNotesMessage(labels.notes_loading);

    $('updateButton').addEventListener('click', () => {
        $('updateButton').disabled = true;
        pywebview.api.start().then((accepted) => { if (!accepted) $('updateButton').disabled = phase !== 'offer'; });
    });
    for (const id of ['laterButton', 'closeButton', 'doneButton']) {
        $(id).addEventListener('click', () => pywebview.api.close());
    }
    $('fullNotes').addEventListener('click', () => pywebview.api.open_notes());
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && phase !== 'running') pywebview.api.close();
    });

    document.fonts.ready.then(() => requestAnimationFrame(() => document.body.classList.add('open')));
}

/**
 * Fill the release notes. `notes` is the output of release_highlights():
 * an optional summary line and sections of labelled items, or null when the
 * release carries none.
 */
function setNotes(notes) {
    notesShown = true;
    const body = $('notesBody');
    const summary = $('summary');
    summary.hidden = !notes?.summary;
    summary.textContent = notes?.summary || '';

    if (!notes?.sections?.length) {
        showNotesMessage(labels.notes_empty);
        return;
    }

    const blocks = notes.sections.map((section) => {
        const block = document.createElement('section');
        block.className = 'note-section';
        if (section.title) {
            const title = document.createElement('h3');
            title.textContent = section.title;
            block.appendChild(title);
        }
        const list = document.createElement('ul');
        for (const item of section.items) {
            const entry = document.createElement('li');
            if (item.label) {
                const label = document.createElement('strong');
                label.textContent = item.label;
                entry.appendChild(label);
            }
            entry.appendChild(document.createTextNode(item.text));
            list.appendChild(entry);
        }
        block.appendChild(list);
        return block;
    });
    if (notes.more) {
        const more = document.createElement('p');
        more.className = 'notes-more';
        more.textContent = labels.notes_more.replace('{count}', notes.more);
        blocks.push(more);
    }
    body.replaceChildren(...blocks);
}

/**
 * Render one moment of the update.
 *
 * @param {object} state - {phase, step, percent, message, detail}. `phase` is
 *     loading, offer, running, done or failed; `step` names the step in
 *     progress (or the one that failed), null before the update starts.
 */
function setState(state) {
    phase = state.phase;
    document.body.dataset.phase = phase;
    $('heading').textContent = labels.headings[phase];
    $('message').textContent = state.message || '';
    $('detail').textContent = state.detail || '';
    $('detail').title = state.detail || '';
    $('percent').textContent = phase === 'running' || phase === 'done' ? `${Math.round(state.percent)}%` : '';
    $('fill').style.width = `${Math.max(0, Math.min(100, state.percent || 0))}%`;

    const current = STEPS.indexOf(state.step);
    for (const item of $('steps').children) {
        const index = STEPS.indexOf(item.dataset.step);
        let stepState = 'pending';
        if (phase === 'done' || (current >= 0 && index < current)) stepState = 'done';
        else if (index === current && phase === 'running') stepState = 'active';
        else if (index === current && phase === 'failed') stepState = 'error';
        item.dataset.state = stepState;
    }

    // A check that failed before the notes arrived must not leave "loading" on screen.
    if (phase === 'failed' && !notesShown) showNotesMessage(labels.notes_unavailable);

    const finished = phase === 'done' || phase === 'failed';
    $('laterButton').hidden = finished;
    $('updateButton').hidden = finished;
    $('updateButton').disabled = phase !== 'offer';
    $('doneButton').hidden = !finished;
    $('closeButton').hidden = phase === 'running';

    if (phase === 'done') startCountdown();
    else $('doneButton').textContent = labels.close;
}

function showNotesMessage(text) {
    const message = document.createElement('p');
    message.className = 'notes-message';
    message.textContent = text;
    $('notesBody').replaceChildren(message);
}

/** The app is already running again, so the window closes on its own. */
function startCountdown() {
    if (countdownId) return;
    let remaining = AUTO_CLOSE_SECONDS;
    const render = () => { $('doneButton').textContent = `${labels.close} (${remaining})`; };
    render();
    countdownId = setInterval(() => {
        remaining -= 1;
        if (remaining > 0) {
            render();
            return;
        }
        clearInterval(countdownId);
        pywebview.api.close();
    }, 1000);
}
</script>
</body>
</html>
